name: Build CHINTU APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Locate and Verify APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "SUCCESS: Found APK at $APK_PATH"
            echo "apk_path=$APK_PATH" >> $GITHUB_ENV
            echo "### ✅ Build Succeeded!" >> $GITHUB_STEP_SUMMARY
            echo "APK Generated at: \`$APK_PATH\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "ERROR: No APK file found in outputs directory."
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chintu-debug-apk
          path: ${{ env.apk_path }}
          retention-days: 7
          
