name: Build CHINTU APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5 (Strict Compatible Version)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        id: gradle_build
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt

      - name: Show Detailed Error in Job Summary (If Failed)
        if: failure()
        run: |
          echo "### ❌ Build Failed! Detailed Error Summary:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -A 25 -B 5 "FAILURE: Build failed" build_log.txt || tail -n 60 build_log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify APK Exists
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "SUCCESS: APK file verified."
            echo "### ✅ Build Succeeded! APK generated." >> $GITHUB_STEP_SUMMARY
          else
            echo "ERROR: APK generation failed!"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chintu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          
